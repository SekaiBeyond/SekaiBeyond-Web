name: Deploy to Firebase

on:
  push:
    branches: [ main ]
    paths-ignore:
      # The API relay, deployed to Cloudflare by hand (see
      # https://docs.sekaibeyond.com/en/website/api-relay).
      - cloudflare/**
      - README.md
      - CONTRIBUTING.md
      - Trademarks.md
      - LICENSE
  workflow_dispatch:

# Queue deploys rather than cancelling one mid-way: a half-finished functions
# deploy is worse than waiting. A newer push still replaces an older queued run.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      # The same public ID the site was just built with, for the functions to
      # check Google sign-ins against. Written here because functions read it
      # from functions/.env, which isn't committed.
      - name: Give the functions the Google client ID
        run: echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> functions/.env
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      # SKBY Manager sign-in (see functions/.env.example). Repository variables,
      # not secrets: none is secret. Left out when unset, which turns it off.
      - name: Give the functions the SKBY Manager settings
        run: |
          for name in MANAGER_PROJECT_ID MANAGER_SERVICE_ACCOUNT MANAGER_ORIGIN; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> functions/.env; fi
          done
        env:
          MANAGER_PROJECT_ID: ${{ vars.MANAGER_PROJECT_ID }}
          MANAGER_SERVICE_ACCOUNT: ${{ vars.MANAGER_SERVICE_ACCOUNT }}
          MANAGER_ORIGIN: ${{ vars.MANAGER_ORIGIN }}

      - name: Generate firebase.generated.json with CSP hashes
        run: npm run update-csp-hashes

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Functions first, on their own, as npm run deploy does. In one command the
      # CLI releases rules before functions, so a functions deploy that stops (a
      # deployed function missing from the source, which non-interactive mode
      # won't delete, or a secret not set) would leave new rules live over the
      # old functions and site. Apart, a stop here ships nothing else.
      - name: Deploy functions
        run: npx -y firebase-tools@15 deploy --non-interactive --config firebase.generated.json --project "$FIREBASE_PROJECT_ID" --only functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      # Everything else, TTL policies included (fieldOverrides in
      # firestore.indexes.json). Hosting is released last, after the rules, so
      # the new frontend never goes live ahead of a function or rule it needs.
      - name: Deploy rules, indexes and hosting
        run: npx -y firebase-tools@15 deploy --non-interactive --config firebase.generated.json --project "$FIREBASE_PROJECT_ID" --except functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
